<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daftar artikel dan dokumentasi teknologi di msanet.">
    <title>Artikel — msanet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="wrapper nav-container">
        <a class="brand" href="index.html"><i class="fa-solid fa-globe"></i><span>msanet</span></a>
        <ul class="menu" id="menu">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a class="active" href="artikel.html"><i class="fa-regular fa-newspaper"></i> Artikel</a></li>
            <li><a href="kategori.html"><i class="fa-regular fa-folder-open"></i> Kategori</a></li>
            <li><a href="kontak.html"><i class="fa-regular fa-envelope"></i> Kontak</a></li>
        </ul>
        <button class="menu-toggle" id="menuToggle" type="button"><i class="fa-solid fa-bars"></i></button>
    </div>
</nav>

<header class="banner">
    <div class="wrapper">
        <h1>Artikel & dokumentasi</h1>
        <p>Cari materi berdasarkan judul, ringkasan, atau kategori.</p>
    </div>
</header>

<main class="wrapper main-content">
    <div class="container">
        <section class="content">
            <div class="section-heading">
                <div><h2>Semua artikel</h2><p id="resultInfo">Memuat data...</p></div>
            </div>
            <div id="articleList" aria-live="polite">
                <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i>Memuat artikel...</div>
            </div>
        </section>

        <aside class="sidebar">
            <div class="box">
                <h4><i class="fa-solid fa-magnifying-glass"></i> Cari artikel</h4>
                <div class="search-field">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="searchInput" placeholder="Ketik kata kunci..." autocomplete="off">
                </div>
            </div>
            <div class="box">
                <h4><i class="fa-regular fa-calendar"></i> Arsip</h4>
                <div id="archiveList">Memuat arsip...</div>
            </div>
        </aside>
    </div>
</main>

<footer class="footer"><div class="wrapper"><p>© 2026 msanet.</p><p><a href="index.html">Kembali ke beranda</a></p></div></footer>
<script src="assets/js/script.js"></script>
<script>
(async () => {
    const articleList = document.getElementById("articleList");
    const archiveList = document.getElementById("archiveList");
    const searchInput = document.getElementById("searchInput");
    const resultInfo = document.getElementById("resultInfo");
    let allData = [];

    function renderArticles(data) {
        articleList.innerHTML = "";
        resultInfo.textContent = `${data.length} artikel ditemukan`;
        if (!data.length) {
            articleList.innerHTML = '<div class="empty-state"><i class="fa-regular fa-face-frown"></i>Tidak ada artikel yang cocok dengan pencarian.</div>';
            return;
        }
        data.forEach(item => articleList.appendChild(window.msanet.createArticleCard(item)));
    }

    function renderArchive(data) {
        const grouped = data.reduce((acc, item) => {
            const key = item.date || "Tanpa tanggal";
            (acc[key] ||= []).push(item);
            return acc;
        }, {});
        const dates = Object.keys(grouped).sort((a, b) => new Date(b || 0) - new Date(a || 0));
        archiveList.innerHTML = "";
        if (!dates.length) {
            archiveList.textContent = "Belum ada arsip.";
            return;
        }
        dates.forEach((date, index) => {
            const wrap = document.createElement("div");
            wrap.className = "archive-item";
            const button = document.createElement("button");
            button.className = "archive-toggle";
            button.type = "button";
            button.innerHTML = `<span>${window.msanet.formatDate(date)}</span><i class="fa-solid fa-chevron-down"></i>`;
            const list = document.createElement("ul");
            list.className = "archive-links";
            list.hidden = index !== 0;
            grouped[date].forEach(item => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = `detail.html?id=${encodeURIComponent(item.id)}`;
                a.textContent = item.title;
                li.appendChild(a);
                list.appendChild(li);
            });
            button.addEventListener("click", () => {
                list.hidden = !list.hidden;
                button.querySelector("i").className = list.hidden ? "fa-solid fa-chevron-down" : "fa-solid fa-chevron-up";
            });
            wrap.append(button, list);
            archiveList.appendChild(wrap);
        });
    }

    try {
        allData = await window.msanet.loadContent();
        allData.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
        const initialQuery = new URLSearchParams(window.location.search).get("q") || "";
        searchInput.value = initialQuery;
        const initialKeyword = initialQuery.trim().toLocaleLowerCase("id-ID");
        const initialData = initialKeyword ? allData.filter(item => [item.title, item.excerpt, item.category]
            .filter(Boolean).some(value => value.toLocaleLowerCase("id-ID").includes(initialKeyword))) : allData;
        renderArticles(initialData);
        renderArchive(allData);
    } catch (error) {
        articleList.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>Gagal memuat artikel. Jalankan website melalui web server/hosting.</div>';
        archiveList.textContent = "Gagal memuat arsip.";
        resultInfo.textContent = "Data tidak tersedia";
        console.error(error);
    }

    searchInput.addEventListener("input", () => {
        const keyword = searchInput.value.trim().toLocaleLowerCase("id-ID");
        const filtered = allData.filter(item => [item.title, item.excerpt, item.category]
            .filter(Boolean)
            .some(value => value.toLocaleLowerCase("id-ID").includes(keyword)));
        renderArticles(filtered);
    });
})();
</script>
</body>
</html>
