<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detail artikel msanet.">
    <title>Detail Artikel — msanet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="wrapper nav-container">
        <a class="brand" href="index.html"><i class="fa-solid fa-globe"></i><span>msanet</span></a>
        <ul class="menu" id="menu">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a class="active" href="artikel.html"><i class="fa-regular fa-newspaper"></i> Artikel</a></li>
            <li><a href="kategori.html"><i class="fa-regular fa-folder-open"></i> Kategori</a></li>
            <li><a href="kontak.html"><i class="fa-regular fa-envelope"></i> Kontak</a></li>
        </ul>
        <button class="menu-toggle" id="menuToggle" type="button"><i class="fa-solid fa-bars"></i></button>
    </div>
</nav>

<header class="banner">
    <div class="wrapper article-shell">
        <a class="back-link" href="artikel.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke artikel</a>
        <h1 id="contentTitle">Memuat artikel...</h1>
        <p id="contentExcerpt"></p>
    </div>
</header>

<main class="wrapper main-content">
    <div class="article-shell">
        <article class="card article-detail" id="contentDetail" aria-live="polite">
            <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i>Memuat konten...</div>
        </article>
    </div>
</main>

<footer class="footer"><div class="wrapper"><p>© 2026 msanet.</p><p><a href="artikel.html">Artikel lainnya</a></p></div></footer>
<script src="assets/js/script.js"></script>
<script>
(() => {
    const params = new URLSearchParams(window.location.search);
    const contentId = params.get("id");
    const titleEl = document.getElementById("contentTitle");
    const excerptEl = document.getElementById("contentExcerpt");
    const detailEl = document.getElementById("contentDetail");

    function looksLikeCode(block) {
        const value = block.trim();
        if (!value) return false;
        return /(^|\n)\s*(ipconfig|ifconfig|ip\s+addr|ping\s+|git\s+|npm\s+|docker\s+|curl\s+|sudo\s+|SELECT\s+|INSERT\s+|UPDATE\s+)/i.test(value)
            || /^\d{1,3}(\.\d{1,3}){3}(\/\d{1,2})?$/m.test(value)
            || /<\/?[a-z][\s\S]*>/i.test(value)
            || /console\.log|function\s+\w*\s*\(|=>|\{[\s\S]*\}|;\s*$/m.test(value);
    }

    function looksLikeHeading(block) {
        const value = block.trim();
        return !value.includes("\n") && value.length <= 72 && value.split(/\s+/).length >= 2 && !/[.!?;:]$/.test(value) && !looksLikeCode(value);
    }

    function renderBody(content) {
        const body = document.createElement("div");
        body.className = "article-body";
        const blocks = String(content || "").replace(/\r/g, "").split(/\n\s*\n+/).map(v => v.trim()).filter(Boolean);

        if (!blocks.length) {
            body.innerHTML = "<p>Tidak ada isi konten.</p>";
            return body;
        }

        blocks.forEach((block, index) => {
            if (looksLikeCode(block)) {
                const pre = document.createElement("pre");
                pre.className = "code-box";
                const code = document.createElement("code");
                code.textContent = block;
                pre.appendChild(code);
                body.appendChild(pre);
                return;
            }

            if (looksLikeHeading(block) && index !== 0) {
                const heading = document.createElement("h2");
                heading.textContent = block;
                body.appendChild(heading);
                return;
            }

            const lines = block.split("\n").filter(Boolean);
            if (lines.length > 1 && looksLikeHeading(lines[0])) {
                const heading = document.createElement(index === 0 ? "h2" : "h2");
                heading.textContent = lines.shift().trim();
                body.appendChild(heading);
            }
            lines.forEach(line => {
                const p = document.createElement("p");
                p.textContent = line.trim();
                body.appendChild(p);
            });
        });
        return body;
    }

    async function loadDetail() {
        if (!contentId) {
            titleEl.textContent = "Artikel tidak ditemukan";
            excerptEl.textContent = "ID artikel tidak tersedia.";
            detailEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-link-slash"></i>Link artikel tidak lengkap.</div>';
            return;
        }

        try {
            const data = await window.msanet.loadContent();
            const item = data.find(entry => String(entry.id) === String(contentId));
            if (!item) {
                titleEl.textContent = "Artikel tidak ditemukan";
                excerptEl.textContent = "Konten yang Anda cari tidak tersedia.";
                detailEl.innerHTML = '<div class="empty-state"><i class="fa-regular fa-face-frown"></i>Artikel tidak ditemukan.</div>';
                return;
            }

            document.title = `${item.title} — msanet`;
            titleEl.textContent = item.title || "Tanpa judul";
            excerptEl.textContent = item.excerpt || "";
            detailEl.innerHTML = "";

            const meta = document.createElement("div");
            meta.className = "article-meta";
            const date = document.createElement("span");
            date.innerHTML = '<i class="fa-regular fa-calendar"></i>';
            date.append(document.createTextNode(` ${window.msanet.formatDate(item.date)}`));
            const category = document.createElement("span");
            category.innerHTML = '<i class="fa-regular fa-folder"></i>';
            category.append(document.createTextNode(` ${item.category || "Umum"}`));
            meta.append(date, category);
            detailEl.append(meta, renderBody(item.content));

            if (Array.isArray(item.files) && item.files.length) {
                const panel = document.createElement("section");
                panel.className = "download-panel";
                const heading = document.createElement("h3");
                heading.textContent = "File download";
                const list = document.createElement("ul");
                list.className = "download-list";
                item.files.forEach(file => {
                    if (!file?.path || !file?.label) return;
                    const li = document.createElement("li");
                    const link = document.createElement("a");
                    link.href = `assets/uploads/${file.path}`;
                    link.setAttribute("download", "");
                    link.innerHTML = '<i class="fa-solid fa-download"></i>';
                    link.append(document.createTextNode(file.label));
                    li.appendChild(link);
                    list.appendChild(li);
                });
                panel.append(heading, list);
                detailEl.appendChild(panel);
            }
        } catch (error) {
            titleEl.textContent = "Terjadi kesalahan";
            excerptEl.textContent = "Konten belum dapat dimuat.";
            detailEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>Gagal memuat artikel. Pastikan website dijalankan melalui web server/hosting.</div>';
            console.error(error);
        }
    }

    loadDetail();
})();
</script>
</body>
</html>
